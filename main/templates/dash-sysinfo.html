<!-- Sysinfo Section -->
<div class="container-fluid pt-4 px-4">

    <div id="spinner"
        class="show position-fixed w-100 vh-100 top-0 start-0 d-flex align-items-center justify-content-center"
        style="z-index: 1050; display: none;">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div class="bg-secondary rounded-top p-4" style="height: 670px;">
        <div class="row">
            <div class="col-12 text-center">
                <h5 class="mb-4">System Information</h5>
                <div id="sysinfo-content" class="overflow-auto" style="max-height: 550px;"></div>
            </div>
        </div>
    </div>
</div>
