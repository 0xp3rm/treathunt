<!-- DASHBOARD ROWS START -->
<div class="container-fluid pt-4 px-4">
    <div class="row g-4">
        <div class="col-md-4">
            <div class="bg-secondary rounded d-flex align-items-center justify-content-between p-4">
                <i class="fa fa-chart-area fa-3x"></i>
                <div class="ms-3">
                    <p class="mb-2">Remote IP</p>
                    <h6 class="mb-0" id="ipCount">0</h6>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="bg-secondary rounded d-flex align-items-center justify-content-between p-4">
                <i class="fa fa-chart-bar fa-3x"></i>
                <div class="ms-3">
                    <p class="mb-2"> SSH Log</p>
                    <h6 class="mb-0" id="sshFailedCount">0</h6>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="bg-secondary rounded d-flex align-items-center justify-content-between p-4">
                <i class="fa fa-chart-pie fa-3x"></i>
                <div class="ms-3">
                    <p class="mb-2">SSH IP</p>
                    <h6 class="mb-0" id="sshIpCount">0</h6>
                </div>
            </div>
        </div>

    </div>
</div>



<!-- IP Lookup Modal -->
<div class="modal fade" id="showLookUpDetails" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content bg-secondary text-white">
            <div class="modal-header">
                <h5 class="modal-title">IP Details</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                    aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div id="ipDetailsText" class="col-lg-7 row fs-6 pt-0"></div>
                    <div class="col-lg-5">
                        <div id="ipMap" style="height: 450px; border-radius: 10px;"></div>
                    </div>
                </div>
                <div id="lookupError" class="text-danger mt-3 d-none">Failed to load IP details.</div>
            </div>
        </div>
    </div>
</div>


<!-- LOG DETAILS -->
<div class="container-fluid pt-4 px-4">
    <div class="row g-4">
        <div class="col-md-6">
            <div class="bg-secondary rounded p-4 position-relative" style="height: 300px;">
                <div style="height: calc(100% - 35px);">
                    <canvas id="summaryChart" style="width:100%; height:100%;"></canvas>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="bg-secondary rounded p-4 position-relative" style="height: 300px;">
                <div style="height: calc(100% - 35px);">
                    <canvas id="sshChart" style="width:100%; height:100%;"></canvas>
                </div>
            </div>
        </div>



        <!-- SSH LOGS COLUMN -->
        <div class="col-md-6">
            <div class="bg-secondary rounded p-4 d-flex flex-column" style="height: 450px;">
                <h6 class="mb-3">SSH DETAILS</h6>

                <div class="table-responsive overflow-auto" style="max-height: 100%;">
                    <table class="table table-bordered  m-0">
                        <thead class="sticky-top bg-dark" style="top: 0; z-index: 1050;">
                            <tr>
                                <th scope="col">SSH IP</th>
                                <th scope="col">Attempt</th>
                            </tr>
                        </thead>
                        <tbody id="dashboardSshLogs" class="text-white">

                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- NetTCP Remote Address -->
        <div class="col-md-6">
            <div class="bg-secondary rounded p-4 d-flex flex-column" style="height: 450px;">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h6 class="mb-0">TCP Remote Address</h6>
                    <button class="btn btn-sm btn-danger delete-btn me-4 px-3"
                        onclick="deleteRemoteIPRecord()">Clear</button>
                </div>
                <div class="table-responsive flex-grow-1 overflow-auto" style="max-height: 100%;">
                    <table class="table m-0 border table-bordered table-hover table-dark rounded">
                        <tbody id="dashRemoteIPdata">
                            <tr>
                                <td colspan="8" class="text-center">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>



    </div>
</div>
