<!-- Sidebar Start -->
<div class="sidebar">
    <nav class="navbar bg-secondary navbar-dark mb-4">
        <div class="navbar-brand mx-4 mb-3 d-flex align-items-center">
            <img src="{{url_for('static' , filename='images/logo-ico.png')}}" alt="Logo"
                style="height: 30px; width: auto;">
            <h3 class="mb-0">THREATHUNT</h3>
        </div>

        <div class="d-flex align-items-center ms-4 mb-4">
            <div class="position-relative">
                <img id="ProfilePictureImage" class="rounded-circle"
                    src="{{url_for('api.get_User_Profile.getProfileImage', filename=session.get('profile_pic_filename') or 'default-image.jpg') }}"
                    alt="Profile Picture" style="width: 40px; height: 40px;">
                <div
                    class="bg-success rounded-circle border border-2 border-white position-absolute end-0 bottom-0 p-1">
                </div>
            </div>
            <div class="ms-3">{% if logged_in %}
                <span>{{ username }}</span>
                {% endif %}
            </div>

        </div>
        <div class="navbar-nav w-100">
            <a href="/dash/board" class="nav-item nav-link {% if request.path == '/dash/board' %}active{% endif %}"><i
                    class="fa fa-th-list me-2"></i>Dashboard</a>
            </a>
            <div class="nav-item dropdown">
                <a href="/dash/services"
                    class="nav-link dropdown-toggle {% if request.path in ['/dash/ssh', '/dash/ftp', '/dash/mysql'] %}active{% endif %}"
                    data-bs-toggle="dropdown">
                    <i class="fa fa-laptop me-2"></i>Services
                </a>
                <div class="dropdown-menu bg-transparent border-0">
                    <a href="/dash/ssh" class="dropdown-item {% if request.path == '/dash/ssh' %}active{% endif %}"
                        style="padding-left: 4.4rem;">Secure
                        Shell</a>
                </div>
            </div>
            <a href="/dash/rules" class="nav-item nav-link {% if request.path == '/dash/rules' %}active{% endif %}">
                <i class="fa fa-th me-2"></i>Rules
            </a>

            <a href="/dash/connection"
                class="nav-item nav-link {% if request.path == '/dash/connection' %}active{% endif %}"><i
                    class="fa fa-wifi me-2"></i>Connection</a>
            <a href="/dash/sysinfo"
                class="nav-item nav-link {% if request.path == '/dash/sysinfo' %}active{% endif %}"><i
                    class="fa fa-info-circle me-2"></i>Sysinfo</a>
            <a href="/dash/about" class="nav-item nav-link {% if request.path == '/dash/about' %}active{% endif %}"><i
                    class="fa fa-question-circle me-2"></i>About</a>
        </div>
    </nav>

</div>
